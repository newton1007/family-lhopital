<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famille Lhopital | Sud & Rugby</title>
    <style>
        :root {
            /* Palette RCT & Sud */
            --rouge: #c0392b;
            --noir: #1a1a1a;
            --soleil: #f1c40f;
            --ciel: #3498db;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #2d3436;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .hero {
            background: linear-gradient(135deg, var(--noir), var(--rouge));
            color: white;
            padding: 80px 20px;
            text-align: center;
            clip-path: ellipse(150% 100% at 50% 0%);
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 900px;
            margin: -50px auto 50px;
            padding: 0 20px;
        }

        .card {
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .btn-sommaire {
            display: inline-block;
            background: var(--rouge);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, background 0.2s;
            border: 2px solid var(--noir);
        }

        .btn-sommaire:hover {
            transform: scale(1.05);
            background: #a93226;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text);
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Famille Lhopital</h1>
        <p>Le soleil du Sud, le cœur Rouge & Noir</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bienvenue chez nous !</h2>
            <p>Ici, entre deux matchs de rugby et le chant des cigales, on apprend en s'amusant. Retrouvez tous nos QCM de révision ci-dessous.</p>
            <br>
            <a href="qcm/index.html" class="btn-sommaire">Accéder à l'Espace QCM</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Famille Lhopital - Sud & Passion
    </footer>
</body>
</html>
