<style>
:root{

  --font:"Lexend","Lexend Deca","Verdana","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;
    --accent:#60a5fa;--accent-hover:#93c5fd;--accent-soft:#1e3a8a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}

h1{font-size:2.2em;margin:0 0 10px;font-weight:800;letter-spacing:-0.02em}
.subtitle{color:var(--muted);margin:0 0 32px;font-size:1.1em}
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:32px 24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05)}
.menu-list{display:grid;gap:16px;list-style:none;padding:0;margin:0}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg);border:2px solid var(--border);border-radius:14px;color:var(--text);text-decoration:none;font-weight:700;transition:all .2s ease}
.menu-item:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.menu-item span.icon{font-size:1.4em}
footer{margin-top:32px;color:var(--muted);font-size:0.9em}
</style>
</head>
