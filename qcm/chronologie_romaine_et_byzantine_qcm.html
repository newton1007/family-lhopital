<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronologie Romaine et Byzantine</title>
<style>
:root{
  --bg:#e9edf5; --card:#ffffff; --text:#1c2550; --muted:#4d5878; --border:#cdd5e8;
  --seg:#cbd3e6; --seg-done:#7d8bbd; --gold:#c99a1e; --gold-soft:#fbf3dc;
  --letter-bg:#e6ebf6; --letter:#28348a; --accent:#28348a;
  --ok:#1d8a4e; --ok-soft:#e2f5ea; --ko:#c43d3d; --ko-soft:#fbe7e7;
  --font:"Lexend","Lexend Deca","Verdana","Segoe UI",sans-serif;
  --size:19px; --lh:1.55; --ls:.01em; --ws:0;
}
body.accessible{ --size:22px; --lh:1.8; --ls:.04em; --ws:.12em; }
@media (prefers-color-scheme: dark){
  :root{--bg:#141a2c;--card:#1d2540;--text:#eef1fb;--muted:#aab3cf;--border:#34405f;
    --seg:#2e3854;--seg-done:#6573a6;--gold:#e0b440;--gold-soft:#3a3220;
    --letter-bg:#2a3456;--letter:#c9d3ff;--accent:#9fb0ff;
    --ok:#4fcf89;--ok-soft:#1b3a2a;--ko:#ff8080;--ko-soft:#442528;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--size);
  line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:1.05em;margin:0;font-weight:700}
.subtitle{color:var(--muted);margin:0;font-size:.75em}
.tools{display:flex;gap:6px}
.tools button{font:inherit;font-size:.68em;padding:5px 11px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer}

.segments{display:flex;gap:6px;margin:0 0 8px;padding:3px 0}
.segments span{flex:1;height:54px;max-height:12vw;border-radius:6px;background:var(--seg);transition:background .25s,transform .25s}
.segments span.done{background:var(--seg-done)}
.segments span.current{background:var(--gold);transform:scale(1.07);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.count{color:var(--muted);font-size:.72em;margin:0 0 18px}

.qrow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.question{font-size:1.15em;font-weight:700;margin:0;letter-spacing:.03em;flex:1}
.speak{flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.72em;color:var(--text);
  background:var(--card);border:2px solid var(--border);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap}
.speak:hover{border-color:var(--accent)}
.qimg{display:block;max-width:100%;max-height:340px;margin:0 auto 18px;border-radius:14px;border:2px solid var(--border);background:#fff}

.choices{display:grid;gap:14px;list-style:none;padding:0;margin:0}
.choice{width:100%;text-align:left;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--border);
  border-radius:14px;padding:14px 18px;cursor:pointer;display:flex;gap:16px;align-items:center;
  transition:border-color .2s,transform .1s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.letter{flex:none;width:2em;height:2em;border-radius:50%;background:var(--letter-bg);color:var(--letter);
  display:grid;place-items:center;font-weight:700;font-size:.9em}
.choice .mark{margin-left:auto;font-weight:700}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .letter{background:var(--ok);color:#fff}
.choice.ko{border-color:var(--ko);background:var(--ko-soft)}
.choice.ko .letter{background:var(--ko);color:#fff}
.choice:disabled{cursor:default}
.choice:disabled:not(.ok):not(.ko){opacity:.6}

.below{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:22px}
.hint-btn{font:inherit;font-size:.9em;color:var(--text);background:transparent;border:2px dashed var(--gold);
  border-radius:999px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.hint-btn:hover{background:var(--gold-soft)}
.hint{margin-top:14px;padding:14px 18px;border-radius:14px;background:var(--gold-soft);border-left:6px solid var(--gold)}
.feedback{margin-top:18px;padding:14px 18px;border-radius:14px}
.feedback.ok{background:var(--ok-soft);border-left:6px solid var(--ok)}
.feedback.ko{background:var(--ko-soft);border-left:6px solid var(--ko)}
.feedback p,.hint p{margin:.2em 0}
.btn{font:inherit;font-weight:700;border:none;border-radius:14px;padding:12px 24px;background:var(--accent);color:var(--card);cursor:pointer}
.btn.secondary{background:var(--letter-bg);color:var(--text)}
.choice:focus-visible,.btn:focus-visible,.speak:focus-visible,.hint-btn:focus-visible,.tools button:focus-visible{
  outline:3px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}

.result{text-align:center;background:var(--card);border:2px solid var(--border);border-radius:18px;padding:28px 20px}
.result h2{margin:0}
.score{font-size:3em;font-weight:800;margin:.1em 0;color:var(--accent)}
.result .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.review{text-align:left;margin-top:22px;display:grid;gap:12px}
.review .item{border:2px solid var(--border);border-radius:14px;padding:12px 16px}
.review .item p{margin:.2em 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.qrow{flex-direction:column;gap:10px}.segments{gap:4px}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="tools">
      <button type="button" id="smaller" aria-label="Texte plus petit">A−</button>
      <button type="button" id="bigger" aria-label="Texte plus grand">A+</button>
      <button type="button" id="toggle-access">Lecture facile</button>
      <button type="button" id="toggle-summary" class="btn" style="font-size:.68em;padding:5px 11px">Sommaire des QCM</button>
    </div>
  </header>

  <section id="summary-page">
    <div class="segments" id="segments-summary" aria-hidden="true"></div>
    <div class="card" style="border:2px solid var(--border);border-radius:14px;padding:20px;background:var(--card);margin-bottom:16px">
      <h3 style="margin:0 0 12px">📚 Sommaire des QCM</h3>
      <div id="qcm-buttons" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px;"></div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="segments" id="segments" aria-hidden="true"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="qrow">
      <h2 class="question" id="question"></h2>
      <button type="button" class="speak" id="speak"><span aria-hidden="true">🔈</span> Écouter</button>
    </div>
    <img class="qimg hidden" id="qimg" alt="">
    <ul class="choices" id="choices"></ul>
    <div class="hint hidden" id="hint" role="status"></div>
    <div class="feedback hidden" id="feedback" role="status"></div>
    <div class="below">
      <button type="button" class="hint-btn" id="hint-btn" aria-controls="hint" aria-expanded="false">
        <span aria-hidden="true">💡</span> Besoin d’aide ?</button>
      <button type="button" class="btn hidden" id="next">Question suivante →</button>
    </div>
  </section>

  <section id="result" class="result hidden" aria-live="polite">
    <h2>Résultat</h2>
    <p class="score" id="score" tabindex="-1"></p>
    <p id="message"></p>
    <div class="actions">
      <button type="button" class="btn" id="retry-errors">Revoir mes erreurs</button>
      <button type="button" class="btn secondary" id="restart">Tout recommencer</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>

<script id="quiz-data" type="application/json">
{
  "title": "Chronologie Romaine et Byzantine",
  "subtitle": "Révision – Frise historique",
  "accessible": true,
  "questions": [
    {
      "q": "En quelle année a eu lieu la **division de l'Empire romain** ?",
      "choices": ["393", "476", "800", "527"],
      "answer": 0,
      "hint": "C'est la première date tout en haut de la frise.",
      "explain": "La division de l'Empire romain a eu lieu en **393**."
    },
    {
      "q": "Quelle est la date de la **disparition de l'Empire romain d'Occident** ?",
      "choices": ["476", "393", "800", "1453"],
      "answer": 0,
      "hint": "C'est l'événement marqué par un point rouge en haut à gauche.",
      "explain": "L'Empire romain d'Occident disparaît en **476**."
    },
    {
      "q": "Quelle est la période du **règne de Justinien** ?",
      "choices": ["527-565", "768-814", "393-1453", "768-987"],
      "answer": 0,
      "hint": "C'est le premier règne indiqué sur l'Empire byzantin.",
      "explain": "Justinien règne de **527 à 565**."
    },
    {
      "q": "Quelles sont les dates de l'**Empire byzantin** selon la frise ?",
      "choices": ["393-1453", "768-987", "527-565", "476-800"],
      "answer": 0,
      "hint": "C'est la longue période violette sur la droite.",
      "explain": "L'Empire byzantin s'étend de **393 à 1453**."
    },
    {
      "q": "Quelle est la période du **règne de Charlemagne** ?",
      "choices": ["768-814", "768-987", "527-565", "393-476"],
      "answer": 0,
      "hint": "C'est la période juste avant l'an 800.",
      "explain": "Charlemagne règne de **768 à 814**."
    },
    {
      "q": "En quelle année a eu lieu le **sacre de Charlemagne** (empereur) ?",
      "choices": ["800", "768", "987", "476"],
      "answer": 0,
      "hint": "C'est un chiffre rond très important au début du IXe siècle.",
      "explain": "Le sacre de Charlemagne a lieu en **800**."
    },
    {
      "q": "Quelles sont les dates de l'**Empire carolingien** ?",
      "choices": ["768-987", "768-814", "527-565", "393-1453"],
      "answer": 0,
      "hint": "C'est la barre mauve horizontale en bas à gauche.",
      "explain": "L'Empire carolingien dure de **768 à 987**."
    },
    {
      "q": "En quelle année a eu lieu l'avènement de **Hugues Capet** ?",
      "choices": ["987", "800", "768", "1453"],
      "answer": 0,
      "hint": "C'est la date indiquée à gauche avec une flèche vers Hugues Capet.",
      "explain": "Hugues Capet arrive en **987**."
    },
    {
      "q": "Quel événement a eu lieu en **1204** selon la frise ?",
      "choices": ["Le pillage de Constantinople par les croisés d'Occident", "La prise de Constantinople par les Turcs", "La disparition de l'Empire romain", "Le sacre de Charlemagne"],
      "answer": 0,
      "hint": "C'est marqué avec une étoile rouge au milieu de la frise byzantine.",
      "explain": "En **1204**, Constantinople est pillée par les croisés d'Occident."
    },
    {
      "q": "En quelle année eut lieu la **prise de Constantinople par les Turcs** ?",
      "choices": ["1453", "1204", "800", "987"],
      "answer": 0,
      "hint": "C'est le tout dernier événement en bas à droite de la frise.",
      "explain": "La ville tombe aux mains des Turcs en **1453**, ce qui met fin à l'Empire byzantin."
    }
  ]
}
</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("quiz-data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var LETTERS = ["A", "B", "C", "D", "E", "F"];
  var order = [], idx = 0, score = 0, errors = [], answered = false, current = null;

  function setRich(el, text) {
    el.textContent = "";
    String(text).split(/(\*\*[^*]+\*\*)/).forEach(function (part) {
      if (/^\*\*[^*]+\*\*$/.test(part)) {
        var b = document.createElement("strong"); b.textContent = part.slice(2, -2); el.appendChild(b);
      } else if (part) { el.appendChild(document.createTextNode(part)); }
    });
  }
  function plain(text) { return String(text).replace(/\*\*/g, ""); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var canSpeak = "speechSynthesis" in window;

  function speak(text) {
    if (!canSpeak) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 0.95; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }
  if (!canSpeak) $("speak").classList.add("hidden");

  var size = null;
  function applySize() { if (size) document.body.style.setProperty("--size", size + "px"); }
  function baseSize() { return size || parseFloat(getComputedStyle(document.body).fontSize); }
  $("bigger").addEventListener("click", function () { size = Math.min(34, baseSize() + 2); applySize(); });
  $("smaller").addEventListener("click", function () { size = Math.max(14, baseSize() - 2); applySize(); });
  function setAccessible(on) {
    document.body.classList.toggle("accessible", on);
    $("toggle-access").textContent = on ? "Mode standard" : "Lecture facile";
    size = null; document.body.style.removeProperty("--size");
  }
  $("toggle-access").addEventListener("click", function () {
    setAccessible(!document.body.classList.contains("accessible"));
  });

  // ===== SOMMAIRE DES QCM =====
  var showSummary = function(show) {
    var summary = $("summary-page"), quiz = $("quiz"), result = $("result");
    summary.classList.toggle("hidden", !show);
    quiz.classList.toggle("hidden", show);
    result.classList.toggle("hidden", show);
    if (show) initSummary();
  };

  $("toggle-summary").addEventListener("click", function() {
    var summary = $("summary-page");
    showSummary(summary.classList.contains("hidden"));
  });

  function initSummary() {
    var container = $("qcm-buttons"); container.textContent = "";
    var quizes = data.quiz_list || [
      {id: "chronologie_romaine_et_byzantine_qcm.html", title: "Chronologie Romaine et Byzantine", questions: data.questions.length}
    ];
    quizes.forEach(q => {
      var box = document.createElement("div");
      box.className = "box";
      box.style.cssText = "border:2px solid var(--border);border-radius:10px;padding:12px;background:var(--card);text-align:center;cursor:pointer;transition:border-color .2s";
      box.innerHTML = `<h3 style="margin:0 0 5px;font-size:.95em">${q.title}</h3><small>${q.questions} questions</small>`;
      box.onmouseenter = () => { box.style.borderColor = "var(--accent)"; box.style.background = "var(--gold-soft)"; };
      box.onmouseleave = () => { box.style.borderColor = "var(--border)"; box.style.background = "var(--card)"; };
      box.onclick = function() {
        if (q.id !== window.location.pathname.split("/").pop()) {
          window.location.href = q.id;
        } else {
          showSummary(false);
        }
      };
      container.appendChild(box);
    });
  }

  function drawSegments() {
    var box = $("segments"); box.textContent = "";
    for (var i = 0; i < order.length; i++) {
      var s = document.createElement("span");
      if (i < idx) s.className = "done"; else if (i === idx) s.className = "current";
      box.appendChild(s);
    }
  }

  function start(indices) {
    order = shuffle(indices.slice()); idx = 0; score = 0; errors = [];
    $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
    show();
  }

  function show() {
    answered = false;
    var q = data.questions[order[idx]];
    current = q;
    drawSegments();
    $("count").textContent = "Question " + (idx + 1) + " sur " + order.length;
    setRich($("question"), q.q);
    var img = $("qimg");
    if (q.image) { img.src = q.image; img.alt = q.imageAlt || "Illustration de la question"; img.classList.remove("hidden"); }
    else { img.removeAttribute("src"); img.classList.add("hidden"); }

    var list = $("choices"); list.textContent = "";
    var opts = shuffle(q.choices.map(function (c, i) { return { text: c, correct: i === q.answer }; }));
    opts.forEach(function (o, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.dataset.correct = o.correct ? "1" : "0";
      var l = document.createElement("span"); l.className = "letter"; l.textContent = LETTERS[i];
      var t = document.createElement("span"); t.className = "text"; setRich(t, o.text);
      b.appendChild(l); b.appendChild(t);
      b.addEventListener("click", function () { choose(b); });
      li.appendChild(b); list.appendChild(li);
    });

    var hint = $("hint"); hint.textContent = ""; hint.classList.add("hidden");
    $("hint-btn").classList.toggle("hidden", !q.hint);
    $("hint-btn").setAttribute("aria-expanded", "false");
    var fb = $("feedback"); fb.className = "feedback hidden"; fb.textContent = "";
    $("next").classList.add("hidden");
    $("next").textContent = idx + 1 < order.length ? "Question suivante →" : "Voir mon résultat";
    var first = list.querySelector("button"); if (first) first.focus({ preventScroll: true });
  }

  $("hint-btn").addEventListener("click", function () {
    if (!current || !current.hint) return;
    var hint = $("hint"), open = hint.classList.contains("hidden");
    hint.textContent = "";
    if (open) { var p = document.createElement("p"); setRich(p, "💡 " + current.hint); hint.appendChild(p); }
    hint.classList.toggle("hidden", !open);
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });

  function addMark(btn, symbol, label) {
    var m = document.createElement("span"); m.className = "mark"; m.textContent = symbol; m.setAttribute("aria-label", label);
    btn.appendChild(m);
  }

  function choose(btn) {
    if (answered) return;
    answered = true;
    var ok = btn.dataset.correct === "1";
    $("choices").querySelectorAll("button").forEach(function (b) {
      b.disabled = true;
      if (b.dataset.correct === "1") { b.classList.add("ok"); addMark(b, "✓", "bonne réponse"); }
    });
    if (!ok) { btn.classList.add("ko"); addMark(btn, "✗", "ta réponse"); }
    if (ok) score++; else errors.push(order[idx]);

    $("hint-btn").classList.add("hidden");
    var fb = $("feedback");
    fb.className = "feedback " + (ok ? "ok" : "ko");
    var head = document.createElement("p"); var s = document.createElement("strong");
    s.textContent = ok ? "✅ Bonne réponse !" : "Pas tout à fait… La bonne réponse a un ✓.";
    head.appendChild(s); fb.appendChild(head);
    if (current.explain) { var p = document.createElement("p"); setRich(p, current.explain); fb.appendChild(p); }
    $("next").classList.remove("hidden"); $("next").focus({ preventScroll: true });
  }

  $("next").addEventListener("click", function () {
    if (canSpeak) window.speechSynthesis.cancel();
    idx++;
    if (idx < order.length) show(); else finish();
  });

  $("speak").addEventListener("click", function () {
    if (!current) return;
    var parts = [plain(current.q)];
    $("choices").querySelectorAll(".choice").forEach(function (b) {
      parts.push(b.querySelector(".letter").textContent + " : " + plain(b.querySelector(".text").textContent));
    });
    speak(parts.join(". "));
  });

  function finish() {
    $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
    var total = order.length, pct = score / total;
    $("score").textContent = score + " / " + total;
    $("message").textContent = pct === 1 ? "🏆 Parfait ! Tu maîtrises ce chapitre."
      : pct >= 0.7 ? "🌟 Très bien ! Encore un petit effort sur les erreurs."
      : pct >= 0.4 ? "👍 C'est un bon début. Revois tes erreurs et réessaie !"
      : "💪 Ce n'est pas grave : chaque essai t'aide à apprendre. On recommence ?";
    $("retry-errors").classList.toggle("hidden", errors.length === 0);
    var review = $("review"); review.textContent = "";
    errors.forEach(function (i) {
      var q = data.questions[i];
      var d = document.createElement("div"); d.className = "item";
      var p1 = document.createElement("p"); setRich(p1, q.q);
      var p2 = document.createElement("p"); var s = document.createElement("strong"); s.textContent = "Réponse : ";
      p2.appendChild(s); var a = document.createElement("span"); setRich(a, q.choices[q.answer]); p2.appendChild(a);
      d.appendChild(p1); d.appendChild(p2);
      if (q.explain) { var p3 = document.createElement("p"); setRich(p3, q.explain); d.appendChild(p3); }
      review.appendChild(d);
    });
    $("score").focus({ preventScroll: true });
  }

  $("retry-errors").addEventListener("click", function () { start(errors); });
  $("restart").addEventListener("click", function () { start(data.questions.map(function (_, i) { return i; })); });

  document.title = plain(data.title || "QCM");
  setRich($("title"), data.title || "QCM");
  $("subtitle").textContent = data.subtitle || "";
  setAccessible(!!data.accessible);
  showSummary(true);
})();
</script>
</body>
</html>
