<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index des QCM</title>
<style>
:root{
  --bg:#e9edf5; --card:#ffffff; --text:#1c2550; --muted:#4d5878; --border:#cdd5e8;
  --seg:#cbd3e6; --seg-done:#7d8bbd; --gold:#c99a1e; --gold-soft:#fbf3dc;
  --letter-bg:#e6ebf6; --letter:#28348a; --accent:#28348a;
  --ok:#1d8a4e; --ok-soft:#e2f5ea; --ko:#c43d3d; --ko-soft:#fbe7e7;
  --font:"Lexend","Lexend Deca","Verdana","Segoe UI",sans-serif;
  --size:19px; --lh:1.55; --ls:.01em; --ws:0;
}
body.accessible{ --size:22px; --lh:1.8; --ls:.04em; --ws:.12em; }
@media (prefers-color-scheme: dark){
  :root{--bg:#141a2c;--card:#1d2540;--text:#eef1fb;--muted:#aab3cf;--border:#34405f;
    --seg:#2e3854;--seg-done:#6573a6;--gold:#e0b440;--gold-soft:#3a3220;
    --letter-bg:#2a3456;--letter:#c9d3ff;--accent:#9fb0ff;
    --ok:#4fcf89;--ok-soft:#1b3a2a;--ko:#ff8080;--ko-soft:#442528;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--var);
  font-size:var(--size);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
header{margin-bottom:24px}
h1{margin:0;font-size:1.2em;font-weight:700}
.subtitle{color:var(--muted);margin:0;font-size:.85em}

.card{border:2px solid var(--border);border-radius:14px;padding:20px;background:var(--card);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:1.1em}
.card p{margin:.4em 0}

.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;border:none;border-radius:14px;padding:10px 18px;background:var(--accent);color:var(--card);cursor:pointer;margin-right:8px;margin-bottom:8px}
.btn.secondary{background:var(--letter-bg);color:var(--text);border:2px solid var(--border)}

.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px}
.box{border:2px solid var(--border);border-radius:10px;padding:12px;background:var(--card);text-align:center;cursor:pointer;transition:border-color .2s}
.box:hover{border-color:var(--accent);background:var(--gold-soft)}
.box.selected{border-color:var(--accent);background:var(--accent);color:var(--card)}

@media (max-width:520px){.grid{grid-template-columns:repeat(auto-fit, minmax(120px, 1fr))}}
</style>
</head>
<body>
<main>
<header>
<h1>📚 Sommaire des QCM</h1>
<p class="subtitle">Sélectionnez un quiz ci-dessous ou ajoutez-en un nouveau</p>
</header>

<section id="quiz-list" class="grid">
<!-- Les QCM seront insérés ici par JavaScript -->
</section>

<section class="card">
<h3>Ajouter un nouveau QCM</h3>
<p>Nom du QCM (ex: "Histoire Romaine") :</p>
<input type="text" id="new-title" placeholder="Titre du QCM" style="padding:8px;border-radius:8px;border:1px solid var(--border);font:inherit;margin-right:8px;width:200px">
<button class="btn" onclick="createNewQuiz()">Créer nouveau QCM</button>
</section>
</main>

<script>
const qcmList = [
  {
    id: 'chronologie_romaine_et_byzantine_qcm.html',
    title: 'Chronologie Romaine et Byzantine',
    subtitle: 'Révision – Frise historique',
    questions: 10,
    accessible: false
  }
];

function renderQuizList() {
  const container = document.getElementById('quiz-list');
  container.innerHTML = '';
  qcmList.forEach(qcm => {
    const box = document.createElement('div');
    box.className = 'box';
    box.innerHTML = `<h3>${qcm.title}</h3><p>${qcm.subtitle}</p><small>${qcm.questions} questions</small>`;
    box.onclick = () => openQuiz(qcm.id);
    if (window.location.search.includes(qcm.id)) box.classList.add('selected');
    container.appendChild(box);
  });
}

function openQuiz(file) {
  window.location.href = file + '?from=index';
}

function createNewQuiz() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) return alert('Entrez un titre pour le QCM');
  const id = title.toLowerCase().replace(/\s+/g, '_') + '_qcm.html';
  qcmList.push({ id, title, subtitle: 'Nouveau QCM', questions: 0, accessible: false });
  renderQuizList();
  alert('QCM ajouté au sommaire');
}

renderQuizList();
</script>
</body>
</html>
